<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .thank-you-container {
            max-width: 600px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 60px 40px;
            text-align: center;
        }

        h1 {
            color: #0078d4;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        p {
            color: #444;
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <div class="icon">🙏</div>
        <h1>Thank You</h1>
        <p>
            Thank you for your time and consideration.
        </p>
        <p>
            We appreciate your interest in Microsoft Research.
        </p>
    </div>
</body>
</html>
