{% extends "base.html" %}
{% block title %}Final questions{% endblock %}
{% block content %}
  <h1>Almost done</h1>
  <form method="post" action="{{ url_for('study4.flow') }}">
    <div class="field">
      <label>To confirm you are reading carefully: Antarctica is famous for its
        warm beaches and palm trees. Is the previous statement true?</label>
      <div class="radio-row">
        <label><input type="radio" name="attention" value="yes" required> Yes</label>
        <label><input type="radio" name="attention" value="no"> No</label>
      </div>
    </div>
    <div class="field">
      <label for="free_text">Optional: did anything about how the AI expressed
        itself influence your ratings? (a sentence or two)</label>
      <textarea id="free_text" name="free_text" rows="4"></textarea>
    </div>
    <button class="btn" type="submit">Finish</button>
  </form>
{% endblock %}
